[project]
name = "xlcs"
version = "0.0.1"
authors = [
  { name="Philippe Miron", email="philippemiron@gmail.com" },
]
description = "python package to generate Lagrangian Coherent Structures from a collection of methods"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "cartopy>=0.25.0",
    "cmocean>=4.0.3",
    "gsw>=3.6.20",
    "matplotlib>=3.10.9",
    "numba>=0.65.1",
    "numpy>=2.2.6",
    "parcels>=3.1.4",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "xarray>=2025.6.1",
    "xgcm>=0.9.0",
    "zarr>=2.18.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["D", "E", "F", "B", "I", "UP"]
ignore = ["D203", "D211", "D213"]

[tool.ruff.lint.per-file-ignores]
"examples/*.ipynb" = ["F403", "F405", "D", "E402", "E501"]
